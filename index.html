<style>
:root{
  --head:#0B3D2E; --head2:#0F5A43; --mint:#34D399; --mint-soft:#A7F3D0; --green:#047857;
  --text:#0F172A; --sub:#334155; --muted:#64748B; --line:#E2E8F0; --alt:#F6F8F7; --chip:#ECF0EE;
  --bg:#F3F5F4; --card:#FFFFFF; --pill:#DCFCE7; --red:#B91C1C;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header{background:linear-gradient(105deg,var(--head) 0 58%,var(--head2) 58% 100%);color:#fff;border-bottom:4px solid var(--mint)}
.hd{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;padding-top:28px;padding-bottom:24px}
.brand{display:flex;align-items:center;gap:10px;color:var(--mint-soft);font-weight:700;font-size:14px}
.logo{width:26px;height:26px;border-radius:7px;background:var(--mint);display:grid;place-items:center;color:var(--head);font-weight:900;font-size:20px;line-height:1}
h1{margin:10px 0 4px;font-size:28px;letter-spacing:-.02em}
.upd{color:var(--mint-soft);font-size:13px}
.upd a{color:#fff;text-decoration:underline;text-underline-offset:3px}
.kpis{display:flex;gap:8px}
.kpi{border:1px solid rgba(52,211,153,.45);background:rgba(22,92,69,.75);border-radius:12px;padding:10px 14px;min-width:104px}
.kpi b{display:block;font-size:24px;line-height:1.2;margin-top:2px}
.kpi span{font-size:12px;color:var(--mint-soft)}
.bar{position:sticky;top:0;z-index:5;background:rgba(243,245,244,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px;padding-bottom:12px;align-items:center}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font:inherit;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--head);color:#fff}
select,input[type=search]{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;color:var(--text)}
input[type=search]{flex:1 1 220px;min-width:0}
.count{font-size:13px;color:var(--muted);margin-left:auto}
main{padding-top:16px;padding-bottom:48px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.th,.row{display:grid;grid-template-columns:minmax(0,1.9fr) 104px 80px minmax(0,1.2fr) 88px minmax(220px,2fr);gap:12px;align-items:center;padding:0 18px}
.th{background:#EEF2F0;font-size:12.5px;font-weight:700;color:var(--sub);height:40px}
.th .r,.row .r{text-align:right}
.row{min-height:72px;padding-top:12px;padding-bottom:12px;border-top:1px solid var(--line)}
.row:nth-child(even){background:var(--alt)}
.nm{font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.nm a{text-decoration:none}
.nm a:hover{text-decoration:underline}
.meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.rv{color:var(--red);font-weight:700}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:5px;margin-right:6px;vertical-align:1px}
.t-real{background:#D1FAE5;color:#065F46}.t-dev{background:#FEF3C7;color:#92400E}
.asset{font-size:14px;color:var(--sub)}
.chip{display:inline-block;margin-top:4px;background:var(--chip);border-radius:5px;padding:1px 6px;font-size:12px;font-weight:700;color:#374151}
.kind{font-weight:700;color:var(--green);font-size:14px}
.pt{font-size:13.5px;color:var(--sub)}
.pt div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:800;font-size:16px}
.amt.na{color:var(--muted);font-weight:700}
.pill{display:inline-block;background:var(--pill);color:var(--green);font-weight:700;font-size:12.5px;border-radius:999px;padding:3px 9px;white-space:nowrap}
.dash{color:var(--muted)}
.fin{margin:0;font-size:13px;line-height:1.55;color:var(--sub);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.fin.auto{color:var(--muted)}
details{grid-column:1/-1;font-size:13px;color:var(--sub);margin-top:-2px}
details summary{cursor:pointer;color:var(--muted);font-size:12.5px;list-style:none;display:inline-block}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"＋ ";}
details[open] summary::before{content:"－ ";}
details ul{margin:6px 0 0;padding-left:18px}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.more{display:block;margin:16px auto 0;font:inherit;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 18px;cursor:pointer}
footer{color:var(--muted);font-size:12.5px;padding-bottom:40px}
@media (max-width:860px){
  .th{display:none}
  .row{grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px}
  .c-name{grid-column:1/2}.c-amt{grid-column:2/3;grid-row:1/2;align-self:start}
  .c-asset,.c-kind,.c-party{grid-column:1/-1}
  .c-asset{display:flex;gap:8px;align-items:center}.c-asset .chip{margin-top:0}
  .c-kind{display:none}
  .c-met{grid-column:1/-1;grid-row:auto;text-align:left;margin-top:4px}
  .c-met .dash{display:none}
  .c-met .fin{-webkit-line-clamp:6}
  .pt div{white-space:normal}
  .kpis{width:100%}.kpi{flex:1;min-width:0}
  h1{font-size:23px}
  .count{margin-left:0;width:100%}
}
</style>
</head>

const TG = "";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Seoul"}));
const daysAgo = d => { const t = new Date(d + "T00:00:00"); return isNaN(t) ? 9999 : (today - t) / 864e5; };
const state = {cat: "", shown: 60};

if (TG) $("#tg").innerHTML = ` · <a href="${esc(TG)}" target="_blank" rel="noopener">텔레그램 채널</a>`;
$("#k-all").textContent = DATA.length.toLocaleString() + "건";
$("#k-real").textContent = DATA.filter(r => r.cat === "실물" && daysAgo(r.date) < 7).length + "건";
$("#k-dev").textContent = DATA.filter(r => r.cat === "개발" && daysAgo(r.date) < 7).length + "건";

function fillSelect(sel, key) {
  const counts = {};
  DATA.forEach(r => { if (r[key]) counts[r[key]] = (counts[r[key]] || 0) + 1; });
  Object.keys(counts).sort((a, b) => counts[b] - counts[a]).forEach(v => {
    const o = document.createElement("option"); o.value = v; o.textContent = `${v} (${counts[v]})`; sel.appendChild(o);
  });
}
fillSelect($("#f-asset"), "asset");
fillSelect($("#f-region"), "region");

function filtered() {
  const q = $("#f-q").value.trim().toLowerCase();
  const grp = $("#f-grp").value, asset = $("#f-asset").value, region = $("#f-region").value;
  const days = +$("#f-days").value, sort = $("#f-sort").value;
  let rows = DATA.filter(r =>
    (!state.cat || r.cat === state.cat) && (!grp || r.grp === grp) && (!asset || r.asset === asset) &&
    (!region || r.region === region) && (!days || daysAgo(r.date) < days) &&
    (!q || [r.name, ...r.p, ...r.detail, r.region, r.asset].join(" ").toLowerCase().includes(q)));
  rows.sort(sort === "amt" ? (a, b) => b.eok - a.eok : (a, b) => (b.date > a.date) - (b.date < a.date) || b.eok - a.eok);
  return rows;
}

function finHTML(f) {
  if (!f || !f.text) return '<span class="dash">-</span>';
  return `<p class="fin${f.auto ? " auto" : ""}" title="${esc(f.text)}">${esc(f.text)}</p>`;
}

function rowHTML(r) {
  const date = r.date ? r.date.slice(2).replaceAll("-", ".") : "";
  const meta = [r.review ? '<span class="rv">● 진행중</span>' : "", esc(date), esc(r.size)].filter(Boolean).join(" · ");
  const name = r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)} ↗</a>` : esc(r.name);
  const tag = `<span class="tag ${r.cat === "실물" ? "t-real" : "t-dev"}">${r.cat}</span>`;
  const party = r.p.length ? r.p.map(x => `<div>${esc(x)}</div>`).join("") : '<div class="dash">-</div>';
  const det = r.detail.length ? `<details><summary>조건·메모</summary><ul>${r.detail.map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>` : "";
  return `<div class="row">
    <div class="c-name"><div class="nm">${tag}${name}</div><div class="meta">${meta}</div></div>
    <div class="c-asset"><span class="asset">${esc(r.asset)}</span>${r.region ? `<span class="chip">${esc(r.region)}</span>` : ""}</div>
    <div class="c-kind kind">${esc(r.kind)}</div>
    <div class="c-party pt"><span class="kind" style="display:none"></span>${party}</div>
    <div class="c-amt r amt ${r.amt === "미공개" ? "na" : ""}">${esc(r.amt)}</div>
    <div class="c-met">${finHTML(r.fin)}</div>
    ${det}</div>`;
}

function render() {
  const rows = filtered();
  const list = $("#list");
  list.querySelectorAll(".row,.empty").forEach(n => n.remove());
  if (!rows.length) list.insertAdjacentHTML("beforeend", '<div class="empty">조건에 맞는 딜이 없습니다.</div>');
  list.insertAdjacentHTML("beforeend", rows.slice(0, state.shown).map(rowHTML).join(""));
  $("#count").textContent = `${rows.length.toLocaleString()}건`;
  $("#more").hidden = rows.length <= state.shown;
}

// 모바일에서는 '구분'을 주체 앞에 한 줄로 붙여 보여줌
const mq = matchMedia("(max-width:860px)");
const _rowHTML = rowHTML;
rowHTML = r => mq.matches
  ? _rowHTML(r).replace('<span class="kind" style="display:none"></span>', `<div class="kind">${esc(r.kind)}</div>`)
  : _rowHTML(r);
mq.addEventListener("change", render);

document.querySelectorAll("#seg-cat button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("#seg-cat button").forEach(x => x.setAttribute("aria-pressed", x === b));
  state.cat = b.dataset.v; state.shown = 60; render();
}));
["#f-grp", "#f-asset", "#f-region", "#f-days", "#f-sort"].forEach(s => $(s).addEventListener("change", () => { state.shown = 60; render(); }));
$("#f-q").addEventListener("input", () => { state.shown = 60; render(); });
$("#more").addEventListener("click", () => { state.shown += 60; render(); });

render();
</script>
